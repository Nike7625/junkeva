/* Layout: sticky header, offer strip, filter row, 2-up product grid on phones. Bottom sheets on phones, side drawers on desktop. Indigo-dye blue with marigold price tags. */
:root{
  --bg:#F3F3F5; --surface:#FFFFFF; --ink:#16181D; --muted:#5C6270; --line:#DDDEE4;
  --btn-bg:#F2B705; --btn-fg:#17130A; --soft:#FFF3C4;
  --tag:#D7262E; --tag-ink:#FFFFFF; --ok:#1B7A4B; --bad:#B3261E;
  --shadow:0 12px 36px rgba(10,10,14,.2);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D10; --surface:#17181D; --ink:#F1F2F5; --muted:#A0A4B0; --line:#2A2C34;
    --btn-bg:#F2B705; --btn-fg:#17130A; --soft:#2B2510;
    --tag:#E5323A; --tag-ink:#FFFFFF; --ok:#4CC38A; --bad:#FF8A80; --shadow:0 12px 36px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0D10; --surface:#17181D; --ink:#F1F2F5; --muted:#A0A4B0; --line:#2A2C34;
  --btn-bg:#F2B705; --btn-fg:#17130A; --soft:#2B2510;
  --tag:#E5323A; --tag-ink:#FFFFFF; --ok:#4CC38A; --bad:#FF8A80; --shadow:0 12px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.num,.price,.amt{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.in{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:8px;min-height:60px}
.logo{flex:none;width:42px;height:42px;border-radius:6px;object-fit:cover;display:block}
.mark{flex:none}
.mark path{fill:var(--btn-bg)}
.mark circle{fill:var(--surface)}
.brand{font:800 22px/1.1 var(--f-display);letter-spacing:-.02em;margin-right:auto;min-width:0;overflow-wrap:anywhere}
.strip{background:var(--tag);color:var(--tag-ink);font-size:13px;font-weight:500}
.strip .in{padding-top:7px;padding-bottom:7px;text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);padding:11px 18px;border-radius:6px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--btn-bg)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.block{width:100%}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.icon-btn{border:1px solid var(--line);background:transparent;width:36px;height:36px;border-radius:6px;font-size:20px;line-height:1;cursor:pointer;flex:none}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.count{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--tag);color:var(--tag-ink);font-size:12px;font-weight:700}

/* page */
.main{padding-top:20px;padding-bottom:56px;display:flex;flex-direction:column;gap:16px}
.intro h1{font-size:clamp(26px,5vw,40px);line-height:1.08;max-width:22ch}
.intro p{margin-top:8px;max-width:56ch}
.callout{border:1px solid var(--tag);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.callout ul{margin:0;padding-left:18px;flex:1 1 240px;min-width:0}
.ctl{display:flex;flex-direction:column;gap:12px}
.ctl .row{display:flex;gap:10px;flex-wrap:wrap}
.field input,.field select,.field textarea,.ctl input,.ctl select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:10px 12px;min-width:0}
.ctl .row input{flex:1 1 200px}
.ctl .row select{flex:0 1 190px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.card:hover{border-color:var(--btn-bg)}
.media{position:relative;aspect-ratio:4/5;max-width:100%;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.media svg{width:72%;height:auto;max-height:86%}
.media img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:10px;left:0;background:var(--tag);color:var(--tag-ink);font-size:12px;font-weight:700;padding:3px 10px 3px 16px;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%)}
.sold{position:absolute;inset:auto 0 0 0;background:rgba(13,18,33,.78);color:#fff;text-align:center;font-size:12px;font-weight:600;padding:5px;letter-spacing:.06em;text-transform:uppercase}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.info h3{font:600 15px/1.3 var(--f-body);letter-spacing:0;overflow-wrap:anywhere}
.cat{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.price{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.price b{font-size:16px}
.price s{color:var(--muted);font-size:13px}
.price.big b{font-size:26px;font-family:var(--f-display)}
.empty{padding:36px 8px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.foot{padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between}

/* layer */
.layer{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(8,12,24,.58)}
.sheet{position:relative;background:var(--surface);width:100%;max-height:92dvh;display:flex;flex-direction:column;border-radius:14px 14px 0 0;box-shadow:var(--shadow);outline:none}
.sh-head{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-head h2{font-size:20px;min-width:0;overflow-wrap:anywhere}
.sh-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;min-height:0}
.sh-foot{border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.sh-foot .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (min-width:720px){
  .layer{align-items:stretch;justify-content:flex-end}
  .sheet{width:500px;max-height:none;border-radius:0}
  .layer.center{align-items:center;justify-content:center}
  .layer.center .sheet{width:min(900px,94vw);max-height:90dvh;border-radius:10px}
}
.pm{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:720px){.pm{grid-template-columns:1fr 1fr}}
.pm-media{position:relative;aspect-ratio:4/5;background:var(--soft);display:grid;place-items:center;overflow:hidden;border-radius:6px;max-width:100%}
.pm-media svg{width:70%;height:auto}
.pm-media img{width:100%;height:100%;object-fit:cover}
.pm-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.sizes{display:flex;flex-wrap:wrap;gap:8px}
.size{min-width:46px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 10px;cursor:pointer;font-weight:500}
.size[aria-pressed="true"]{border-color:var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg)}
.lbl{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px}
.qty button{width:36px;height:36px;background:transparent;border:0;font-size:18px;cursor:pointer}
.qty span{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.err{color:var(--bad);font-size:13px;min-height:1px}
.line{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:start;padding-bottom:14px;border-bottom:1px solid var(--line)}
.thumb{width:64px;aspect-ratio:4/5;background:var(--soft);display:grid;place-items:center;overflow:hidden;border-radius:4px}
.thumb svg{width:80%;height:auto}
.thumb img{width:100%;height:100%;object-fit:cover}
.l-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.l-info b{overflow-wrap:anywhere}
.l-price{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-weight:600;font-variant-numeric:tabular-nums}
.sum{display:flex;flex-direction:column;gap:6px}
.sum div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field textarea{resize:vertical;min-height:70px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two-col{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:transparent;border-radius:6px;padding:10px 12px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--btn-bg);background:var(--soft)}
.opt i{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);margin-top:3px}
.opt[aria-pressed="true"] i{border-color:var(--btn-bg);background:var(--btn-bg);box-shadow:inset 0 0 0 3px var(--surface)}
.opt b{display:block}
.opt span{font-size:13px;color:var(--muted)}
.paybox{display:flex;gap:16px;flex-wrap:wrap;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:12px}
.paybox.col{flex-direction:column;align-items:flex-start}
.qr{background:#fff;padding:10px;border-radius:6px;line-height:0;min-width:188px;min-height:188px}
.qr canvas,.qr img{max-width:100%}
.pay-meta{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0;flex:1 1 180px}
.amt{font:800 28px/1 var(--f-display)}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
code{background:var(--soft);padding:4px 8px;border-radius:4px;overflow-wrap:anywhere;font-size:13px}
.done{display:flex;flex-direction:column;gap:12px}
.tick{width:48px;height:48px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
textarea.ro{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace}
.tabs{display:flex;gap:8px}
.tabs .chip{flex:1}
.prow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.prow .thumb{width:44px}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:transparent;cursor:pointer}
.pill.in-s{border-color:var(--ok);color:var(--ok)}
.pill.out-s{border-color:var(--bad);color:var(--bad)}
.imgrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}}

/* ---------- totals, payment ---------- */
function totals(pay){
 var sub=0;cart.forEach(function(i){var p=prod(i.pid);if(p)sub+=p.price*i.qty});
 var s=S();
 var ship=sub===0?0:(sub>=Number(s.freeShipAbove||0)&&Number(s.freeShipAbove)>0?0:Number(s.shipFee||0));
 var cod=(pay==='cod'&&sub>0)?Number(s.codFee||0):0;
 return {sub:sub,ship:ship,cod:cod,total:sub+ship+cod};
}

 if(s.codEnabled)m.push({id:'cod',label:'Cash on delivery',sub:Number(s.codFee)?('Pay on arrival. Handling fee '+inr(s.codFee)+'.'):'Pay when it arrives.'});
 return m;

  '<div class="two-col"><div class="field"><label for="pf-cat">Category</label><input id="pf-cat" data-pf="cat" list="cat-list" value="'+esc(e.cat)+'"><datalist id="cat-list">'+cats().filter(function(c){return c!=='All'}).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div>'+
  '<div class="field"><label for="pf-type">Shape for placeholder picture</label><select id="pf-type" data-pf="type">'+typeOpts+'</select></div></div>'+
  '<div class="two-col"><div class="field"><label for="pf-price">Selling price (₹)</label><input id="pf-price" data-pf="price" type="number" inputmode="numeric" min="1" value="'+esc(e.price)+'"></div>'+
  '<div class="field"><label for="pf-mrp">MRP (₹, optional)</label><input id="pf-mrp" data-pf="mrp" type="number" inputmode="numeric" min="0" value="'+esc(e.mrp)+'"></div></div>'+
  '<div class="field"><label for="pf-sizes">Sizes, separated by commas</label><input id="pf-sizes" data-pf="sizes" value="'+esc(e.sizes)+'" placeholder="S, M, L, XL"><small>Leave empty for free size.</small></div>'+
  '<div class="field"><label for="pf-desc">Description</label><textarea id="pf-desc" data-pf="desc">'+esc(e.desc)+'</textarea></div>'+
  '<div class="field"><label for="pf-img">Photo file</label><input id="pf-img" data-pf="img" value="'+esc(e.img)+'" placeholder="images/tshirt1.jpg"><small>Upload the photo into the images folder on GitHub, then type its path here. Leave empty to show the drawing.</small></div>'+
  '<div class="two-col"><div class="field"><label for="pf-color">Colour of the placeholder picture</label><input id="pf-color" data-pf="color" type="color" value="'+esc(e.color)+'"></div>'+
  '<div class="field"><label for="pf-stock">Availability</label><select id="pf-stock" data-pf="inStock"><option value="1"'+(e.inStock?' selected':'')+'>In stock</option><option value="0"'+(e.inStock?'':' selected')+'>Sold out</option></select></div></div>'+
  '<p class="err" id="perr">'+esc(ui.perr)+'</p>'+
  '<div class="two-col"><button class="btn ghost" data-act="pcancel">Cancel</button><button class="btn" data-act="psave">Save product</button></div>';
 }else if(ui.tab==='products'){
  body='<button class="btn" data-act="padd">Add product</button>'+(STORE.products.length?STORE.products.map(function(p){
   var del=ui.confirmDel===p.id?'<button class="btn sm" style="background:var(--bad);border-color:var(--bad);color:#fff" data-act="pdelok" data-id="'+esc(p.id)+'">Confirm delete</button><button class="btn ghost sm" data-act="pdelno">Keep</button>':'<button class="btn ghost sm" data-act="pedit" data-id="'+esc(p.id)+'">Edit</button><button class="btn ghost sm" data-act="pdel" data-id="'+esc(p.id)+'">Delete</button>';
   return '<div class="prow"><div class="thumb">'+media(p)+'</div><div style="min-width:0"><b style="overflow-wrap:anywhere">'+esc(p.name)+'</b><div class="muted">'+esc(p.cat)+' · '+inr(p.price)+'</div><button class="pill '+(p.inStock?'in-s':'out-s')+'" data-act="stk" data-id="'+esc(p.id)+'">'+(p.inStock?'In stock':'Sold out')+'</button></div><div class="acts">'+del+'</div></div>';
  }).join(''):'<p class="muted">No products yet.</p>');
 }else{
  body='<h3>Store</h3>'+sf('s-name','name','Store name')+sf('s-tag','tagline','Headline on the home page')+sf('s-ann','announcement','Offer banner at the top','Leave empty to hide it.')+
  '<h3>Orders and payments</h3>'+
  sf('s-wa','whatsapp','WhatsApp number for orders','Include country code, for example 919876543210. Every order is sent to this number.','tel')+
  sf('s-upi','upiId','Your UPI ID','For example shopname@okaxis. Customers pay by QR or UPI ID and enter the reference number.')+
  sf('s-pn','payeeName','Name shown in UPI apps')+
  sf('s-rzp','razorpayLink','Razorpay payment page link (optional)','Starts with https://. Create a Payment Page in your Razorpay dashboard that lets the customer enter the amount.','url')+
  '<h3>Shipping and COD</h3><div class="two-col">'+sf('s-ship','shipFee','Shipping fee (₹)','','number')+sf('s-free','freeShipAbove','Free shipping above (₹)','','number')+'</div>'+
  '<div class="two-col"><div class="field"><label for="s-cod">Cash on delivery</label><select id="s-cod" data-s="codEnabled"><option value="1"'+(S().codEnabled?' selected':'')+'>Accept COD</option><option value="0"'+(S().codEnabled?'':' selected')+'>No COD</option></select></div>'+sf('s-codfee','codFee','COD handling fee (₹)','','number')+'</div>';
 }
 var foot=ui.editing?'':'<div class="sh-foot"><p class="muted" style="font-size:13px">Changes show only on this screen. Copy store.json and paste it into the store.json file on GitHub, then commit. Your live site updates in about a minute.</p>'+(ui.showExport?'<textarea id="exptxt" class="ro" rows="6" readonly>'+esc(JSON.stringify(STORE,null,2))+'</textarea>':'')+'<button class="btn block" id="pubbtn" data-act="publish">Copy store.json</button></div>';
 return head('Manage store')+(ui.editing?'':'<div class="sh-body" style="padding-bottom:0;flex:none"><div class="tabs"><button class="chip" data-act="tab" data-v="settings" aria-pressed="'+(ui.tab==='settings')+'">Setup</button><button class="chip" data-act="tab" data-v="products" aria-pressed="'+(ui.tab==='products')+'">Products</button></div></div>')+'<div class="sh-body">'+body+'</div>'+foot;
}

/* ---------- layer ---------- */
function renderLayer(){
 var L=$('#layer');
 var oldBody=L.querySelector('.sh-body:last-of-type');
 var keep=(oldBody&&L.dataset.p===ui.panel)?oldBody.scrollTop:0;
 if(!ui.panel){L.hidden=true;L.innerHTML='';L.dataset.p='';document.documentElement.style.overflow='';return}
 var html='';
 if(ui.panel==='product')html=pProduct();
 else if(ui.panel==='cart')html=pCart();
 else if(ui.panel==='checkout')html=pCheckout();
 else if(ui.panel==='done')html=pDone();
 else if(ui.panel==='orders')html=pOrders();
 else if(ui.panel==='admin')html=pAdmin();
 var fresh=L.dataset.p!==ui.panel;
 L.className='layer'+(ui.panel==='product'?' center':'');
 L.innerHTML='<div class="scrim" data-act="close"></div><section class="sheet" tabindex="-1" role="dialog" aria-modal="true">'+html+'</section>';
 L.dataset.p=ui.panel;
 L.hidden=false;
 document.documentElement.style.overflow='hidden';
 var b=L.querySelector('.sh-body:last-of-type');
 if(b&&keep)b.scrollTop=keep;
 if(fresh){var sh=L.querySelector('.sheet');if(sh)sh.focus({preventScroll:true})}
 var q=document.getElementById('qr');
 if(q&&window.QRCode){
  try{new QRCode(q,{text:upiUri(totals('upi').total),width:168,height:168,colorDark:'#0b1020',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}
 }
}
function openPanel(name){ui.panel=name;renderLayer()}
function closePanel(){ui.panel=null;ui.editing=null;ui.confirmDel=null;renderLayer()}

/* ---------- cart actions ---------- */
function addToCart(){
 var p=prod(ui.pid);if(!p)return false;
 if(!ui.sel.size){var e=document.getElementById('perr-sel');if(e)e.textContent='Choose a size first.';return false}
 var f=cart.find(function(i){return i.pid===p.id&&i.size===ui.sel.size});
 if(f)f.qty=Math.min(20,f.qty+ui.sel.qty);else cart.push({pid:p.id,size:ui.sel.size,qty:ui.sel.qty});
 saveCart();renderHeader();return true;
}
function validate(){
 if(form.name.trim().length<2)return 'Enter your full name.';
 var ph=form.phone.replace(/\D/g,'');
 if(ph.length<10||ph.length>12)return 'Enter a 10-digit mobile number.';
 if(form.address.trim().length<8)return 'Enter your full address.';
 if(form.city.trim().length<2)return 'Enter your city.';
 if(!/^\d{6}$/.test(form.pin.trim()))return 'Enter a 6-digit pincode.';
 if((form.pay==='upi'||form.pay==='rzp')&&form.ref.trim().length<6)return form.pay==='upi'?'Pay first, then enter the UPI reference number (UTR).':'Pay on Razorpay first, then enter the payment ID.';
 return '';
}
function placeOrder(){
 var msg=validate();
 var er=document.getElementById('err');
 if(msg){if(er)er.textContent=msg;return}
 var t=totals(form.pay);
 var ph=form.phone.replace(/\D/g,'').slice(-10);
 var o={id:newId(),at:Date.now(),items:cart.map(function(i){var p=prod(i.pid);return {name:p.name,size:i.size,qty:i.qty,price:p.price}}),sub:t.sub,ship:t.ship,cod:t.cod,total:t.total,name:form.name.trim(),phone:ph,address:form.address.trim(),city:form.city.trim(),pin:form.pin.trim(),notes:form.notes.trim(),pay:form.pay,ref:form.ref.trim()};
 orders.unshift(o);orders=orders.slice(0,20);lsSet('je_orders',orders);
 cart=[];saveCart();form.ref='';
 ui.last=o;renderHeader();openPanel('done');
}
function copyText(text,okMsg,ta){
 function fallback(){if(ta){ta.focus();ta.select()}toast('Press and hold to copy the selected text')}
 try{navigator.clipboard.writeText(text).then(function(){toast(okMsg)},fallback)}catch(e){fallback()}
}

/* ---------- admin actions ---------- */
function markDirty(){
 ui.dirty=true;renderHeader();renderOwner();
 var b=document.getElementById('pubbtn');if(b)b.disabled=false;
}
function parseSizes(s){var a=String(s||'').split(',').map(function(x){return x.trim()}).filter(Boolean);return a.length?a:['Free size']}
function startEdit(p){
 ui.perr='';
 ui.editing=p?{id:p.id,isNew:false,name:p.name,cat:p.cat,type:p.type,color:p.color,price:p.price,mrp:p.mrp||'',sizes:p.sizes.join(', '),desc:p.desc||'',img:p.img||'',inStock:p.inStock}:{id:'',isNew:true,name:'',cat:cats()[1]||'',type:'top',color:'#2B3F8F',price:'',mrp:'',sizes:'S, M, L, XL',desc:'',img:'',inStock:true};
 renderLayer();
}
function saveProduct(){
 var e=ui.editing,pe=document.getElementById('perr');
 var price=Number(e.price);
 if(!String(e.name).trim()){ui.perr='Enter a product name.';if(pe)pe.textContent=ui.perr;return}
 if(!(price>0)){ui.perr='Enter a selling price above zero.';if(pe)pe.textContent=ui.perr;return}
 var rec={id:e.id||('p'+Date.now().toString(36)),name:String(e.name).trim(),cat:String(e.cat||'').trim()||'General',type:e.type,color:e.color,price:Math.round(price),mrp:Math.round(Number(e.mrp)||0),sizes:parseSizes(e.sizes),desc:String(e.desc||'').trim(),img:e.img||'',inStock:!!e.inStock};
 var ix=STORE.products.findIndex(function(p){return p.id===rec.id});
 if(ix>=0)STORE.products[ix]=rec;else STORE.products.push(rec);
 STORE.samples=false;ui.editing=null;ui.perr='';
 markDirty();renderLayer();renderCtl();renderGrid();
}
function publish(){
 var json=JSON.stringify(STORE,null,2);
 try{navigator.clipboard.writeText(json).then(function(){ui.dirty=false;renderHeader();renderOwner();toast('store.json copied. Paste it into GitHub.')},function(){ui.showExport=true;renderLayer();var t=document.getElementById('exptxt');if(t){t.focus();t.select()}toast('Select all the text below and copy it')})}
 catch(e){ui.showExport=true;renderLayer();var t=document.getElementById('exptxt');if(t){t.focus();t.select()}toast('Select all the text below and copy it')}
}

/* ---------- events ---------- */
var app=$('#app');
app.addEventListener('click',function(e){
 var t=e.target.closest('[data-act]');if(!t)return;
 var a=t.dataset.act;
 if(a==='close'){closePanel();return}
 if(a==='cat'){ui.cat=t.dataset.v;renderCtl();renderGrid();return}
 if(a==='open'){var p=prod(t.dataset.id);if(!p)return;ui.pid=p.id;ui.sel={size:p.sizes.length===1?p.sizes[0]:null,qty:1};openPanel('product');return}
 if(a==='size'){ui.sel.size=t.dataset.v;renderLayer();return}
 if(a==='pq'){ui.sel.qty=Math.max(1,Math.min(20,ui.sel.qty+Number(t.dataset.d)));renderLayer();return}
 if(a==='add'){if(addToCart()){closePanel();toast('Added to cart')}return}
 if(a==='buy'){if(addToCart())openPanel('checkout');return}
 if(a==='cart'){openPanel('cart');return}
 if(a==='orders'){openPanel('orders');return}
 if(a==='cinc'||a==='cdec'){var i=cart[Number(t.dataset.i)];if(i){i.qty=Math.max(1,Math.min(20,i.qty+(a==='cinc'?1:-1)));saveCart();renderHeader();renderLayer()}return}
 if(a==='rm'){cart.splice(Number(t.dataset.i),1);saveCart();renderHeader();renderLayer();return}
 if(a==='checkout'){openPanel('checkout');return}
 if(a==='pay'){form.pay=t.dataset.v;form.ref='';renderLayer();return}
 if(a==='place'){placeOrder();return}
 if(a==='copyupi'){copyText(S().upiId,'UPI ID copied');return}
 if(a==='copyord'){var ta=document.getElementById('ordtxt');copyText(ta?ta.value:'','Order details copied',ta);return}
 if(a==='admin'){if(ui.canEdit){ui.editing=null;openPanel('admin')}return}
 if(a==='tab'){ui.tab=t.dataset.v;renderLayer();return}
 if(a==='padd'){startEdit(null);return}
 if(a==='pedit'){startEdit(prod(t.dataset.id));return}
 if(a==='pcancel'){ui.editing=null;renderLayer();return}
 if(a==='psave'){saveProduct();return}
 if(a==='pdel'){ui.confirmDel=t.dataset.id;renderLayer();return}
 if(a==='pdelno'){ui.confirmDel=null;renderLayer();return}
 if(a==='pdelok'){STORE.products=STORE.products.filter(function(p){return p.id!==t.dataset.id});STORE.samples=false;ui.confirmDel=null;if(ui.cat!=='All'&&cats().indexOf(ui.cat)<0)ui.cat='All';markDirty();renderLayer();renderCtl();renderGrid();return}
 if(a==='stk'){var sp=prod(t.dataset.id);if(sp){sp.inStock=!sp.inStock;markDirty();renderLayer();renderGrid()}return}
 if(a==='pimg'){var fi=document.getElementById('pimgfile');if(fi)fi.click();return}
 if(a==='pimgrm'){ui.editing.img='';renderLayer();return}
 if(a==='publish'){publish();return}
});
app.addEventListener('keydown',function(e){
 if(e.key==='Enter'||e.key===' '){
  var c=e.target.closest&&e.target.closest('.card[data-act]');
  if(c&&e.target===c){e.preventDefault();c.click()}
 }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.panel)closePanel()});
app.addEventListener('input',function(e){
 var el=e.target;
 if(el.id==='q'){ui.q=el.value.trim().toLowerCase();renderGrid();return}
 if(el.id==='sort'){ui.sort=el.value;renderGrid();return}
 if(el.dataset.f){
  var k=el.dataset.f;form[k]=el.value;
  if(k!=='ref'&&k!=='pay'&&k!=='notes'){var c={};['name','phone','address','city','pin'].forEach(function(x){c[x]=form[x]});lsSet('je_cust',c)}
  var er=document.getElementById('err');if(er)er.textContent='';
  return;
 }
 if(el.dataset.s){
  var key=el.dataset.s,v=el.value;
  if(key==='shipFee'||key==='freeShipAbove'||key==='codFee')v=Math.max(0,Number(v)||0);
  else if(key==='codEnabled')v=(v==='1');
  else if(key==='whatsapp')v=String(v).replace(/[^\d+]/g,'');
  S()[key]=v;
  markDirty();
  if(key==='name')renderHeader();
  if(key==='announcement')renderStrip();
  if(key==='tagline')renderIntro();
  if(key==='whatsapp')renderFoot();
  return;
 }
 if(el.dataset.pf&&ui.editing){
  var f=el.dataset.pf;
  ui.editing[f]=(f==='inStock')?(el.value==='1'):el.value;
  if(f==='type'||f==='color'){/* refresh preview thumb only */var th=app.querySelector('.imgrow .thumb');if(th&&!ui.editing.img)th.innerHTML=art({name:ui.editing.name,type:ui.editing.type,color:ui.editing.color})}
  return;
 }
});
app.addEventListener('change',function(e){
 if(e.target.id==='pimgfile'&&e.target.files&&e.target.files[0])uploadImg(e.target.files[0]);
});

ui.canEdit=false;
fetch('store.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.settings&&d.products)STORE=d}).catch(function(){}).then(boot);
})();
</script>
</body></html>
